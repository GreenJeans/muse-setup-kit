  <line x1="24" y1="408" x2="841" y2="408" stroke="#d0d7de"/>
  <text x="24" y="430" font-size="12" fill="#57606a">Verdicts: Muse is the home platform the kit was distilled from — graded by the same battery, warts included.</text>
  <text x="24" y="448" font-size="12" fill="#57606a">Grok Bot and OpenBot ship as platform profiles. Gemini Tasks measured as a pattern set, not a profile.</text>
  <text x="24" y="466" font-size="12" fill="#57606a">Test 6 fails everywhere measured: no platform isolates agents yet.</text>
