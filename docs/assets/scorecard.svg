<svg xmlns="http://www.w3.org/2000/svg" width="865" height="488" viewBox="0 0 865 488" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="865" height="488" rx="10" fill="#f6f8fa"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1f2328">The ten-test platform battery — measured, not vibes</text>
  <text x="24" y="54" font-size="12" fill="#57606a">Same battery, four platforms. Every kit claim carries its grade: measured, vendor-documented, or unmeasured.</text>

  <!-- header -->
  <g font-size="13" font-weight="600" fill="#1f2328">
    <text x="24" y="86">Test</text>
    <text x="470" y="86" text-anchor="middle">Muse</text>
    <text x="575" y="86" text-anchor="middle">Grok Bot</text>
    <text x="680" y="86" text-anchor="middle">OpenBot</text>
    <text x="785" y="86" text-anchor="middle">Gemini Tasks</text>
  </g>
  <line x1="24" y1="96" x2="841" y2="96" stroke="#d0d7de"/>

  <!-- rows: y = 118 + i*30; cells 84x22 centered at 470/575/680/785 -->
  <g font-size="13" fill="#1f2328">
    <text x="24" y="121">1 · Instruction loading</text>
    <text x="24" y="151">2 · Routine environment</text>
    <text x="24" y="181">3 · Persistence &amp; memory</text>
    <text x="24" y="211">4 · Rule adoption</text>
    <text x="24" y="241">5 · Approval model</text>
    <text x="24" y="271">6 · Scope &amp; isolation</text>
    <text x="24" y="301">7 · Egress (branch + tag)</text>
    <text x="24" y="331">8 · Skill portability &amp; drift</text>
    <text x="24" y="361">9 · Self-visibility</text>
    <text x="24" y="391">10 · Silence &amp; detection</text>
  </g>

