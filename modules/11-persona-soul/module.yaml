reads: "the existing persona file if one exists, the adopter's interview answers, and, for examples the adopter cannot supply, their interaction history."
writes: "the persona file (SOUL.md), drafted from the interview and written only on the adopter's approval; the soul linter, copied as a tool."
network: "none."
jobs: "none of its own; the periodic reread rides the brief's monthly pass or the memory linter's weekly run when either is installed."
rehearsed_at: "library branch runs 16-17 (2026-11-21) on the branch at 41eb24e plus the module as built; friction fixes followed in the same pass, re-rehearsal at the committed pin pending"
data_classes: [personal, third-party]
action_classes: [none]
files:
  - path: templates/SOUL.template.md
    class: static-rendered
  - path: templates/interview.md
    class: static-verbatim
  - path: tools/soul_lint.py
    class: static-verbatim
