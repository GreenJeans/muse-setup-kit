id: core/persona-soul
dir: modules/11-persona-soul
title: Persona & Soul
pitch: "Author the persona file deliberately instead of inheriting the stock template: an interview, a front-loaded template with examples, a mechanical linter, and staged-diff governance for every later change."
version: "0.1"
maintainer: Muse Setup Kit maintainer
license: MIT
kit_compat: [kit-1]
depends_on: [core/core-procedures]
requires: [persona-file]
