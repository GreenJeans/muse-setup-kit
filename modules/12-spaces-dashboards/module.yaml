id: core/spaces-dashboards
dir: modules/12-spaces-dashboards
title: Spaces & Living Dashboards
pitch: "Audit the pages your setup accumulates, merge and budget them, and build the few that stay alive: exception-first, enum status, freshness-stamped, auto-refreshed."
version: "0.1"
maintainer: Muse Setup Kit maintainer
license: MIT
kit_compat: [kit-1]
depends_on: [core/core-procedures]
requires: [spaces]
degrades_without: [scheduling]
reads: "the user's space catalog (each space's actions, snapshot and state, version history), the sidebar order, refresh schedules, and the tracked items or goals a page claims to reflect. Metadata and freshness first; page content only as needed."
writes: "a spaces audit and redesign plan in the workspace; new or edited spaces only after the user approves the plan; sidebar order only on approval; deletes only per space, individually confirmed."
network: "public web, for pattern research when the platform's own literature is thin."
jobs: "none of its own; each dynamic page names its refresh machinery (a scheduled space action preferred) at build time, and those schedules belong to the pages."
rehearsed_at: "run 21 (2026-11-21) on the spaces-module branch pre-commit: scripted-persona audit of a fictional 9-space catalog; procedure and templates exercised, platform mechanics not. Texts and the run record amended in the EX-036/037 fix pass (branch tip b7844ce); re-rehearsed in run 22 (2026-11-21) on the v0.13-prep branch at the v0.12 release content (module byte-identical between 7214200 and c1cf88a): fresh fictional 12-space catalog, the post-review hardening exercised — cross-check disagreement handled to agreement, scope files for merged and kept-dynamic pages, a badge-first stale-render defect found as stipulated, numbered deletes with one approval voided by a post-approval edit and re-presented; one template note line added post-run (sidebar-plan deletes); re-rehearsed in run 28 (2026-11-22) on the v0.14-prep branch at checkout pin 0be5410 — the audit worksheet exercised the split Cross-check (machinery) / Cross-check (values) fields (maintainer call 1) in a full install"
data_classes: [personal]
action_classes: [delete]
